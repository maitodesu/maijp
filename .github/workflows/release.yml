name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: maijp-linux-x86_64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: maijp-windows-x86_64.zip }
          - { os: macos-latest, target: aarch64-apple-darwin, name: maijp-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, name: maijp-macos-x86_64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --release --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release
          mkdir -p pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            # The icon is embedded in maijp.exe by build.rs.
            7z a "$GITHUB_WORKSPACE/${{ matrix.name }}" "./$bin/maijp.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            app=pkg/maijp.app/Contents
            mkdir -p $app/MacOS $app/Resources maijp.iconset
            cp $bin/maijp $app/MacOS/
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            sed "s/VERSION/$version/g" packaging/Info.plist > $app/Info.plist
            for n in 16 32 128 256 512; do
              sips -z $n $n assets/icon/maijp.png --out maijp.iconset/icon_${n}x${n}.png
              sips -z $((n*2)) $((n*2)) assets/icon/maijp.png --out maijp.iconset/icon_${n}x${n}@2x.png
            done
            iconutil -c icns maijp.iconset -o $app/Resources/maijp.icns
            tar czf "$GITHUB_WORKSPACE/${{ matrix.name }}" -C pkg maijp.app
          else
            cp $bin/maijp packaging/dev.maitodesu.maijp.desktop packaging/install.sh pkg/
            cp assets/icon/maijp-512.png pkg/maijp.png
            tar czf "$GITHUB_WORKSPACE/${{ matrix.name }}" -C pkg .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: maijp-*
          generate_release_notes: true
