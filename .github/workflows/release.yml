name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: maijp-linux-x86_64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: maijp-windows-x86_64.zip }
          - { os: macos-latest, target: aarch64-apple-darwin, name: maijp-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, name: maijp-macos-x86_64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --release --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/${{ matrix.name }}" maijp.exe
          else
            tar czf "$GITHUB_WORKSPACE/${{ matrix.name }}" maijp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: maijp-*
          generate_release_notes: true
