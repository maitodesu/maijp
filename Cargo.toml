[package]
name = "maijp"
version = "0.2.0"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", branch = "dev" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2
